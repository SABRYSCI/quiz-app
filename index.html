<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>اختبار المحاليل الشامل (40 سؤال)</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --correct-color: #2ecc71;
            --wrong-color: #e74c3c;
            --text-color: #333;
            --btn-bg: rgba(255, 255, 255, 0.95);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Cairo', sans-serif;
        }

        body, html {
            height: 100%;
            overflow: hidden;
            background-color: #2c3e50;
        }

        #quiz-container {
            width: 100%;
            height: 100%;
            position: relative;
        }

        /* تنسيق شريط التقدم */
        #progress-wrapper {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 8px;
            background-color: rgba(255, 255, 255, 0.2);
            z-index: 100;
            display: none;
        }

        #progress-bar {
            height: 100%;
            width: 0%;
            background-color: #2ecc71;
            transition: width 0.4s ease;
            box-shadow: 0 0 10px #2ecc71;
        }

        .progress-text-badge {
            position: absolute;
            top: 20px;
            left: 20px;
            font-size: 1.2rem;
            font-weight: 900;
            color: white;
            background: rgba(0,0,0,0.6);
            padding: 8px 20px;
            border-radius: 30px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            z-index: 100;
            display: none;
        }

        /* تنسيق شاشة البداية */
        #welcome-screen {
            background: linear-gradient(135deg, #1D2B64 0%, #F8CDDA 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
        }

        .welcome-box {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            padding: 3rem;
            border-radius: 20px;
            text-align: center;
            border: 2px solid rgba(255,255,255,0.2);
            box-shadow: 0 15px 35px rgba(0,0,0,0.2);
            width: 90%;
            max-width: 500px;
        }

        .welcome-box h1 {
            color: #fff;
            font-size: 2.5rem;
            margin-bottom: 2rem;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
        }

        .input-group {
            margin-bottom: 1.5rem;
            text-align: right;
        }

        .input-group label {
            display: block;
            color: #fff;
            font-size: 1.2rem;
            margin-bottom: 0.5rem;
        }

        .input-group input, .input-group select {
            width: 100%;
            padding: 1rem;
            font-size: 1.2rem;
            border-radius: 10px;
            border: none;
            outline: none;
            font-family: 'Cairo', sans-serif;
        }

        .start-btn {
            background-color: #f1c40f;
            color: #333;
            border: none;
            padding: 1rem 3rem;
            font-size: 1.5rem;
            font-weight: 900;
            border-radius: 30px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            margin-top: 1rem;
            width: 100%;
        }

        .start-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 8px 20px rgba(0,0,0,0.3);
        }

        #quiz-slides {
            width: 100%;
            height: 100%;
        }

        .slide {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 2rem;
            text-align: center;
            animation: fadeIn 0.6s ease-in-out;
        }

        .slide.active {
            display: flex;
        }

        .icon {
            font-size: 5rem;
            margin-bottom: 1rem;
            filter: drop-shadow(0px 8px 10px rgba(0,0,0,0.3));
        }

        .question-text {
            font-size: 2.5rem;
            font-weight: 900;
            color: #fff;
            text-shadow: 2px 4px 6px rgba(0,0,0,0.6);
            margin-bottom: 2rem;
            max-width: 90%;
            line-height: 1.5;
        }

        .options-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1.5rem;
            width: 85%;
            max-width: 900px;
        }

        .option-btn {
            background-color: var(--btn-bg);
            border: 4px solid transparent;
            border-radius: 20px;
            padding: 1.5rem;
            font-size: 1.6rem;
            font-weight: 900;
            color: var(--text-color);
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 8px 20px rgba(0,0,0,0.2);
        }

        .option-btn:hover:not(:disabled) {
            transform: translateY(-5px) scale(1.02);
            box-shadow: 0 12px 25px rgba(0,0,0,0.3);
            background-color: #fff;
        }

        .option-btn:disabled {
            cursor: not-allowed;
            opacity: 0.9;
        }

        .option-btn.correct {
            background-color: var(--correct-color);
            color: white;
            border-color: #27ae60;
        }

        .option-btn.wrong {
            background-color: var(--wrong-color);
            color: white;
            border-color: #c0392b;
        }

        .feedback-container {
            margin-top: 2rem;
            min-height: 90px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .feedback-text {
            font-size: 1.6rem;
            font-weight: 700;
            color: #fff;
            background-color: rgba(0, 0, 0, 0.7);
            padding: 1rem 2rem;
            border-radius: 15px;
            display: none;
            animation: popIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            max-width: 800px;
        }

        .next-btn {
            margin-top: 1.5rem;
            padding: 1rem 4rem;
            font-size: 1.8rem;
            font-weight: 900;
            background-color: #f1c40f;
            color: #2c3e50;
            border: none;
            border-radius: 40px;
            cursor: pointer;
            display: none;
            box-shadow: 0 8px 20px rgba(0,0,0,0.4);
            transition: all 0.2s;
        }

        .next-btn:hover {
            transform: scale(1.1);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes popIn {
            from { transform: scale(0.5); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        #result-slide {
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
        }
        
        .loading-text {
            color: #3498db;
            font-size: 1.5rem;
            margin-top: 1rem;
            display: none;
        }

        .action-btns {
            display: flex;
            gap: 1rem;
            margin-top: 2rem;
            flex-wrap: wrap;
            justify-content: center;
        }

        .retry-btn {
            background-color: #e67e22;
            color: white;
            border: none;
            padding: 1rem 2rem;
            font-size: 1.5rem;
            font-weight: 900;
            border-radius: 20px;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .retry-btn:hover { transform: scale(1.05); }

        .restart-btn {
            background-color: #fff;
            color: #333;
            border: none;
            padding: 1rem 2rem;
            font-size: 1.5rem;
            font-weight: 900;
            border-radius: 20px;
            cursor: pointer;
            transition: transform 0.2s;
        }
        
        .restart-btn:hover { transform: scale(1.05); }
    </style>
</head>
<body>

    <div id="quiz-container">
        <!-- شريط التقدم -->
        <div id="progress-wrapper">
            <div id="progress-bar"></div>
        </div>
        <div id="progress-text" class="progress-text-badge"></div>

        <!-- شاشة تسجيل الدخول -->
        <div id="welcome-screen">
            <div class="welcome-box">
                <div class="icon">🎓</div>
                <h1>اختبار المحاليل</h1>
                <div class="input-group">
                    <label for="student-name">الاسم الرباعي:</label>
                    <input type="text" id="student-name" placeholder="اكتب اسمك هنا..." required>
                </div>
                <div class="input-group">
                    <label for="student-class">الصف:</label>
                    <select id="student-class">
                        <option value="" disabled selected>اختر صفك...</option>
                        <option value="ثاني إعدادي أول">ثاني إعدادي أول</option>
                        <option value="ثاني إعدادي ثاني">ثاني إعدادي ثاني</option>
                        <option value="ثاني إعدادي ثالث">ثاني إعدادي ثالث</option>
                        <option value="ثاني إعدادي رابع">ثاني إعدادي رابع</option>
                    </select>
                </div>
                <button class="start-btn" onclick="startQuiz()">ابدأ الاختبار 🚀</button>
            </div>
        </div>

        <!-- حاوية الشرائح -->
        <div id="quiz-slides"></div>
    </div>

            { question: "المادة التي توجد بكمية أقل دائماً في أي محلول تسمى:", options: ["المذيب", "المذاب", "المركب", "العنصر"], answer: 1, feedback: "المادة الموجودة بقلة في المحلول يُطلق عليها اسم 'مذاب'.", icon: "📉" },
            { question: "لكي نصنع محلولاً غازياً، الشرط الأساسي هو أن يكون المذيب:", options: ["صلباً", "سائلاً", "غازاً", "ماءً"], answer: 2, feedback: "المحلول الغازي يجب أن يكون المذيب فيه عبارة عن غاز.", icon: "🎈" },
            { question: "في الهواء الجوي، لماذا نعتبر غاز الأكسجين (21%) مذاباً وليس مذيباً؟", options: ["لأنه غاز", "لأنه أثقل من النيتروجين", "لأنه يتنفسه الإنسان", "لأنه يوجد بنسبة أقل من النيتروجين"], answer: 3, feedback: "النسبة الأقل (21%) تجعله مذاباً، بينما النيتروجين (78%) هو المذيب.", icon: "📊" },
            { question: "أي من التالي يُصنف كـ 'سبائك فلزية' وفقاً للصورة؟", options: ["الفولاذ والنحاس الأصفر", "الحديد والنحاس النقي", "الذهب والفضة", "الماء والملح"], answer: 0, feedback: "الصورة ذكرت الفولاذ والنحاس الأصفر كأمثلة على السبائك الفلزية.", icon: "⚔️" },
            { question: "ما هي حالة المذاب في محلول 'سكر × ماء'؟", options: ["صلب", "سائل", "غاز", "جميع ما سبق"], answer: 0, feedback: "السكر هو المذاب وحالته الفيزيائية هي صلب.", icon: "🍬" },
            { question: "إذا كانت نسبة النحاس 70% في سبيكة النحاس الأصفر، فكم نسبة الخارصين؟", options: ["10%", "20%", "30%", "40%"], answer: 2, feedback: "النسبة المكملة لـ 100% هي 30% للخارصين.", icon: "🧮" },
            { question: "في المشروبات الغازية، ماذا تمثل عبارة 'غاز × سائل'؟", options: ["مذيب × مذاب", "مذاب × مذيب", "غازان مختلفان", "سائلان مختلفان"], answer: 1, feedback: "تعني أن الغاز (مذاب) تم إذابته في السائل (مذيب).", icon: "📝" },
            { question: "أي من هذه المحاليل يحتوي على مذاب غازي في مذيب سائل؟", options: ["ماء البحر والمشروبات الغازية", "الخل وماء البحر", "الفولاذ والنحاس الأصفر", "الهواء الجوي"], answer: 0, feedback: "كلاهما يحتوي على غاز مذاب في سائل (CO2 في المشروبات، وأكسجين في البحر).", icon: "💡" },
            { question: "تلخيصاً للخريطة الذهنية: نوع المحلول يتبع دائماً...", options: ["حالة المذاب", "حالة المذيب", "كمية المذاب", "لون المحلول"], answer: 1, feedback: "القاعدة الذهبية المكتوبة في الأعلى: تحدد نوع المحلول على حسب حالة المذيب.", icon: "📌" }
        ];

        const gradients = [
            "linear-gradient(135deg, #1cb5e0 0%, #000046 100%)",
            "linear-gradient(135deg, #FF8008 0%, #FFA03A 100%)",
            "linear-gradient(135deg, #11998e 0%, #38ef7d 100%)",
            "linear-gradient(135deg, #FC466B 0%, #3F5EFB 100%)",
            "linear-gradient(135deg, #4b6cb7 0%, #182848 100%)"
        ];

        let currentStudentName = "";
        let currentStudentClass = "";
        let score = 0;
        let currentSlideIndex = 0;
        
        // متغيرات للتحكم بوضع الإعادة
        let isRetryMode = false;
        let wrongAnswers = []; 
        let activeQuestions = []; 

        function startQuiz() {
            const nameInput = document.getElementById('student-name').value;
            const classInput = document.getElementById('student-class').value;

            if(nameInput.trim() === "" || classInput === "") {
                alert("الرجاء إدخال اسمك واختيار صفك للبدء!");
                return;
            }

            currentStudentName = nameInput;
            currentStudentClass = classInput;
            
            // تعيين جميع الأسئلة للمحاولة الأولى
            activeQuestions = Array.from({length: quizData.length}, (_, i) => i);

            document.getElementById('welcome-screen').style.display = 'none';
            document.getElementById('progress-wrapper').style.display = 'block';
            document.getElementById('progress-text').style.display = 'block';
            
            buildQuiz();
            updateProgress(0);
        }

        function buildQuiz() {
            const container = document.getElementById('quiz-slides');
            container.innerHTML = ''; // مسح الشرائح القديمة

            activeQuestions.forEach((qIndex, index) => {
                const q = quizData[qIndex];
                const slide = document.createElement('div');
                slide.className = `slide ${index === 0 ? 'active' : ''}`;
                slide.style.background = gradients[qIndex % gradients.length];
                slide.id = `slide-${index}`;

                const icon = `<div class="icon">${q.icon}</div>`;
                const question = `<h2 class="question-text">${q.question}</h2>`;
                
                let optionsHtml = '<div class="options-grid">';
                q.options.forEach((opt, optIndex) => {
                    optionsHtml += `<button class="option-btn" onclick="checkAnswer(${qIndex}, ${optIndex}, this, ${index})">${opt}</button>`;
                });
                optionsHtml += '</div>';

                const feedback = `
                    <div class="feedback-container">
                        <div class="feedback-text" id="feedback-${index}"></div>
                        <button class="next-btn" id="next-${index}" onclick="nextSlide()">السؤال التالي ➔</button>
                    </div>
                `;

                slide.innerHTML = icon + question + optionsHtml + feedback;
                container.appendChild(slide);
            });

            // شريحة النتيجة
            const resultSlide = document.createElement('div');
            resultSlide.className = 'slide';
            resultSlide.id = 'result-slide';
            resultSlide.innerHTML = `
                <div class="icon">🏆</div>
                <h2 class="question-text" id="result-title">أحسنت يا ${currentStudentName}!</h2>
                <h2 class="question-text" id="final-score" style="font-size: 3rem; color: #f1c40f;"></h2>
                
                <div id="loading-msg" class="loading-text">جاري إرسال النتيجة للمعلم... ⏳</div>
                <div id="success-msg" class="loading-text" style="color: #2ecc71;">تم تسجيل النتيجة بنجاح! ✅</div>
                
                <div class="action-btns" id="action-btns" style="display: none;">
                    <button class="retry-btn" id="retry-btn" onclick="startRetry()" style="display:none;">مراجعة أسئلتي الخاطئة 📝</button>
                    <button class="restart-btn" onclick="location.reload()">إعادة الاختبار من البداية 🔄</button>
                </div>
            `;
            container.appendChild(resultSlide);
        }

        function checkAnswer(actualQuestionIndex, selectedOptionIndex, btnElement, slideIndex) {
            const question = quizData[actualQuestionIndex];
            const slide = document.getElementById(`slide-${slideIndex}`);
            const buttons = slide.querySelectorAll('.option-btn');
            const feedbackText = document.getElementById(`feedback-${slideIndex}`);
            const nextBtn = document.getElementById(`next-${slideIndex}`);

            // تعطيل الأزرار
            buttons.forEach(btn => btn.disabled = true);

            const isCorrect = selectedOptionIndex === question.answer;

            if (isCorrect) {
                btnElement.classList.add('correct');
                feedbackText.innerHTML = "✅ إجابة صحيحة!<br>" + question.feedback;
                feedbackText.style.backgroundColor = "rgba(46, 204, 113, 0.95)";
                // زيادة الدرجة فقط إذا لم نكن في وضع الإعادة
                if (!isRetryMode) {
                    score++;
                }
            } else {
                btnElement.classList.add('wrong');
                buttons[question.answer].classList.add('correct');
                feedbackText.innerHTML = "❌ إجابة خاطئة.<br>" + question.feedback;
                feedbackText.style.backgroundColor = "rgba(231, 76, 60, 0.95)";
                // تسجيل السؤال الخاطئ فقط في المحاولة الأولى
                if (!isRetryMode) {
                    wrongAnswers.push(actualQuestionIndex);
                }
            }

            feedbackText.style.display = 'block';
            
            if(slideIndex === activeQuestions.length - 1) {
                nextBtn.innerText = "إنهاء وعرض النتيجة 🏁";
            }
            nextBtn.style.display = 'block';
        }

        function nextSlide() {
            const currentSlide = document.getElementById(`slide-${currentSlideIndex}`);
            currentSlide.classList.remove('active');
            
            currentSlideIndex++;
            updateProgress(currentSlideIndex);
            
            if (currentSlideIndex < activeQuestions.length) {
                const nextSlideElement = document.getElementById(`slide-${currentSlideIndex}`);
                nextSlideElement.classList.add('active');
            } else {
                showResults();
            }
        }

        function updateProgress(index) {
            const total = activeQuestions.length;
            if (index < total) {
                const percentage = ((index) / total) * 100;
                document.getElementById('progress-bar').style.width = percentage + '%';
                document.getElementById('progress-text').innerText = `السؤال ${index + 1} من ${total}`;
            } else {
                document.getElementById('progress-bar').style.width = '100%';
                document.getElementById('progress-text').style.display = 'none';
                document.getElementById('progress-wrapper').style.display = 'none';
            }
        }

        function showResults() {
            const resultSlide = document.getElementById('result-slide');
            resultSlide.classList.add('active');
            
            if (!isRetryMode) {
                document.getElementById('final-score').innerText = `نتيجتك المعتمدة: ${score} من ${quizData.length}`;
                sendDataToGoogle();
                
                // إظهار زر الإعادة إذا كان هناك أخطاء
                if (wrongAnswers.length > 0) {
                    document.getElementById('retry-btn').style.display = 'block';
                }
            } else {
                document.getElementById('result-title').innerText = "أنهيت مراجعة الأخطاء!";
                document.getElementById('final-score').innerText = `ستبقى نتيجتك المعتمدة: ${score} من ${quizData.length}`;
                document.getElementById('action-btns').style.display = 'flex';
                // إخفاء رسائل الإرسال في وضع الإعادة
                document.getElementById('loading-msg').style.display = 'none';
                document.getElementById('success-msg').style.display = 'none';
            }
        }

        function startRetry() {
            isRetryMode = true;
            activeQuestions = [...wrongAnswers]; // نسخ الأسئلة الخاطئة
            wrongAnswers = []; // تفريغها للمحاولة الجديدة
            currentSlideIndex = 0;
            
            document.getElementById('progress-wrapper').style.display = 'block';
            document.getElementById('progress-text').style.display = 'block';
            
            buildQuiz();
            updateProgress(0);
        }

        function sendDataToGoogle() {
            document.getElementById('loading-msg').style.display = 'block';
            document.getElementById('action-btns').style.display = 'none';

            const url = `${GOOGLE_SCRIPT_URL}?name=${encodeURIComponent(currentStudentName)}&studentClass=${encodeURIComponent(currentStudentClass)}&score=${score}`;

            fetch(url, { method: 'GET', mode: 'no-cors' })
                .then(() => {
                    document.getElementById('loading-msg').style.display = 'none';
                    document.getElementById('success-msg').style.display = 'block';
                    document.getElementById('action-btns').style.display = 'flex';
                })
                .catch(error => {
                    console.error('Error!', error.message);
                    document.getElementById('loading-msg').innerText = "حدث خطأ أثناء الإرسال. لا تقلق، لقد تم حفظ النتيجة محلياً.";
                    document.getElementById('loading-msg').style.color = "#e74c3c";
                    document.getElementById('action-btns').style.display = 'flex';
                });
        }
    </script>
</body>
</html>
