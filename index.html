<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>اختبار المحاليل الشامل</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --correct-color: #2ecc71;
            --wrong-color: #e74c3c;
            --text-color: #333;
            --btn-bg: rgba(255, 255, 255, 0.95);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Cairo', sans-serif;
        }

        body, html {
            height: 100%;
            overflow: hidden;
            background-color: #2c3e50;
        }

        /* --- شاشات العرض --- */
        .screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 2rem;
            text-align: center;
            animation: fadeIn 0.5s ease-in-out;
        }

        .screen.active {
            display: flex;
        }

        /* --- شاشة الدخول --- */
        #login-screen {
            background: linear-gradient(135deg, #1D2B64 0%, #F8CDDA 100%);
        }
        
        .login-box {
            background: rgba(255, 255, 255, 0.9);
            padding: 3rem;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            width: 90%;
            max-width: 500px;
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        .login-box h2 {
            color: #333;
            font-size: 2rem;
            margin-bottom: 1rem;
        }

        .login-input, .login-select {
            width: 100%;
            padding: 1rem;
            font-size: 1.2rem;
            border: 2px solid #ccc;
            border-radius: 10px;
            outline: none;
            font-weight: 700;
        }

        .login-input:focus, .login-select:focus {
            border-color: #3498db;
        }

        .start-btn {
            padding: 1rem;
            font-size: 1.5rem;
            font-weight: 900;
            background: #2ecc71;
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: 0.3s;
        }

        .start-btn:hover {
            background: #27ae60;
            transform: scale(1.05);
        }

        /* --- شريط التقدم --- */
        #progress-wrapper {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            width: 90%;
            max-width: 800px;
            background: rgba(0,0,0,0.6);
            padding: 15px 25px;
            border-radius: 30px;
            z-index: 10;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        #progress-text {
            color: white;
            font-size: 1.2rem;
            font-weight: 900;
        }

        #progress-bar-bg {
            width: 100%;
            height: 12px;
            background: rgba(255,255,255,0.2);
            border-radius: 6px;
            overflow: hidden;
        }

        #progress-bar-fill {
            height: 100%;
            background: #2ecc71;
            width: 0%;
            transition: width 0.4s ease;
        }

        /* --- شاشة الاختبار --- */
        .icon {
            font-size: 5rem;
            margin-bottom: 1rem;
            filter: drop-shadow(0px 8px 10px rgba(0,0,0,0.3));
            margin-top: 60px; /* لترك مساحة لشريط التقدم */
        }

        .question-text {
            font-size: 2.5rem;
            font-weight: 900;
            color: #fff;
            text-shadow: 2px 4px 6px rgba(0,0,0,0.6);
            margin-bottom: 2rem;
            max-width: 90%;
            line-height: 1.5;
        }

        .options-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1.5rem;
            width: 85%;
            max-width: 900px;
        }

        .option-btn {
            background-color: var(--btn-bg);
            border: 4px solid transparent;
            border-radius: 20px;
            padding: 1.5rem;
            font-size: 1.6rem;
            font-weight: 900;
            color: var(--text-color);
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 8px 20px rgba(0,0,0,0.2);
        }

        .option-btn:hover:not(:disabled) {
            transform: translateY(-5px) scale(1.02);
            box-shadow: 0 12px 25px rgba(0,0,0,0.3);
            background-color: #fff;
        }

        .option-btn:disabled {
            cursor: not-allowed;
            opacity: 0.9;
        }

        .option-btn.correct { background-color: var(--correct-color); color: white; border-color: #27ae60; }
        .option-btn.wrong { background-color: var(--wrong-color); color: white; border-color: #c0392b; }

        .feedback-container {
            margin-top: 1.5rem;
            min-height: 90px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .feedback-text {
            font-size: 1.6rem;
            font-weight: 700;
            color: #fff;
            background-color: rgba(0, 0, 0, 0.7);
            padding: 1rem 2rem;
            border-radius: 15px;
            display: none;
            max-width: 800px;
        }

        .next-btn {
            margin-top: 1.5rem;
            padding: 1rem 4rem;
            font-size: 1.8rem;
            font-weight: 900;
            background-color: #f1c40f;
            color: #2c3e50;
            border: none;
            border-radius: 40px;
            cursor: pointer;
            display: none;
            box-shadow: 0 8px 20px rgba(0,0,0,0.4);
            transition: all 0.2s;
        }

        .next-btn:hover { transform: scale(1.1); background-color: #f39c12; }

        /* --- شاشة النتيجة --- */
        #result-screen {
            background: linear-gradient(135deg, #1D2B64 0%, #F8CDDA 100%);
        }
        
        .action-btn {
            margin-top: 1rem;
            padding: 1rem 2rem;
            font-size: 1.5rem;
            font-weight: 900;
            border: none;
            border-radius: 20px;
            cursor: pointer;
            width: 350px;
            max-width: 90%;
            transition: 0.3s;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }

        .retry-btn { background-color: #fff; color: #333; }
        .retry-btn:hover { transform: scale(1.05); }

        .review-btn { background-color: #e67e22; color: #fff; display: none; }
        .review-btn:hover { background-color: #d35400; transform: scale(1.05); }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        /* --- التوافق مع الهواتف المحمولة --- */
        @media (max-width: 768px) {
            .options-grid {
                grid-template-columns: 1fr; 
                width: 95%;
                gap: 10px;
            }
            .question-text {
                font-size: 1.6rem; 
                margin-bottom: 1rem;
                margin-top: 1rem;
            }
            .option-btn {
                font-size: 1.2rem; 
                padding: 1rem;
            }
            .icon {
                font-size: 3rem;
                margin-bottom: 0.5rem;
                margin-top: 80px;
            }
            .feedback-text {
                font-size: 1.2rem;
                padding: 0.8rem;
            }
            .next-btn {
                font-size: 1.3rem;
                padding: 0.8rem 2rem;
            }
            .login-box h2 {
                font-size: 1.5rem;
            }
            #progress-text {
                font-size: 1rem;
            }
        }
    </style>
</head>
<body>

    <!-- شاشة تسجيل الدخول -->
    <div id="login-screen" class="screen active">
        <div class="login-box">
            <h2>🧪 أهلاً بك في اختبار المحاليل</h2>
            <input type="text" id="studentName" class="login-input" placeholder="اكتب اسمك الثلاثي" required>
            <select id="studentClass" class="login-select" required>
                <option value="" disabled selected>اختر صفك</option>
                <option value="ثاني إعدادي 1">ثاني إعدادي 1</option>
                <option value="ثاني إعدادي 2">ثاني إعدادي 2</option>
                <option value="ثاني إعدادي 3">ثاني إعدادي 3</option>
                <option value="ثاني إعدادي 4">ثاني إعدادي 4</option>
            </select>
            <button onclick="startQuiz()" class="start-btn">ابدأ الاختبار 🚀</button>
        </div>
    </div>

    <!-- شاشة الاختبار -->
    <div id="quiz-screen" class="screen">
        <div id="progress-wrapper">
            <div id="progress-text">السؤال 1 من 40</div>
            <div id="progress-bar-bg">
                <div id="progress-bar-fill"></div>
            </div>
        </div>
        
        <div id="q-icon" class="icon"></div>
        <h2 id="q-text" class="question-text"></h2>
        <div id="q-options" class="options-grid"></div>
        
        <div class="feedback-container">
            <div id="q-feedback" class="feedback-text"></div>
            <button id="next-btn" class="next-btn" onclick="handleNextAction()">السؤال التالي ➔</button>
        </div>
    </div>

    <!-- شاشة النتيجة -->
    <div id="result-screen" class="screen">
        <div class="icon" style="margin-top: 0;">🏆</div>
        <h2 class="question-text" id="result-msg">انتهى الاختبار بنجاح!</h2>
        <h2 class="question-text" id="final-score" style="font-size: 4rem; color: #f1c40f; margin-bottom: 3rem;"></h2>
        
        <div id="loading-msg" style="color: white; font-size: 1.2rem; margin-bottom: 1rem;">جاري تسجيل النتيجة للأستاذ... ⏳</div>

        <button id="review-btn" class="action-btn review-btn" onclick="startReviewMode()">مراجعة أخطائي 📝</button>
        <button class="action-btn retry-btn" onclick="location.reload()">إعادة الاختبار من البداية 🔄</button>
    </div>

            { question: "في ماء المحيط، ما هي الحالة الفيزيائية للمذيب؟", options: ["صلب", "غاز", "سائل", "بلازما"], answer: 2, feedback: "المذيب في ماء المحيط هو الماء، وحالته سائلة.", icon: "🛥️" },
            { question: "في محلول (ملح × ماء)، لماذا تم تصنيف المحلول كـ 'محلول سائل' رغم أن الملح صلب؟", options: ["لأن الملح يتحول لسائل", "لأن المذيب (الماء) سائل", "لأن الملح يتبخر", "لأن كمية الملح أكبر"], answer: 1, feedback: "نوع المحلول يتبع دائماً حالة المذيب.", icon: "🧂" },
            { question: "لماذا يعتبر 'النحاس الأصفر' محلولاً صلباً؟", options: ["لأن المذيب (النحاس) حالته صلبة", "لأنه لا يذوب في الماء", "لأن المذاب سائل", "لأن لونه أصفر"], answer: 0, feedback: "تحدد نوع المحلول على حسب حالة المذيب.", icon: "🎷" },
            { question: "المادة التي توجد بكمية أقل دائماً في أي محلول تسمى:", options: ["المذيب", "المذاب", "المركب", "العنصر"], answer: 1, feedback: "المادة الموجودة بقلة في المحلول يُطلق عليها اسم 'مذاب'.", icon: "📉" },
            { question: "لكي نصنع محلولاً غازياً، الشرط الأساسي هو أن يكون المذيب:", options: ["صلباً", "سائلاً", "غازاً", "ماءً"], answer: 2, feedback: "المحلول الغازي يجب أن يكون المذيب فيه عبارة عن غاز.", icon: "🎈" },
            { question: "في الهواء الجوي، لماذا نعتبر غاز الأكسجين (21%) مذاباً وليس مذيباً؟", options: ["لأنه غاز", "لأنه أثقل من النيتروجين", "لأنه يتنفسه الإنسان", "لأنه يوجد بنسبة أقل"], answer: 3, feedback: "النسبة الأقل (21%) تجعله مذاباً.", icon: "📊" },
            { question: "أي من التالي يُصنف كـ 'سبائك فلزية' وفقاً للصورة؟", options: ["الفولاذ والنحاس الأصفر", "الحديد والنحاس النقي", "الذهب والفضة", "الماء والملح"], answer: 0, feedback: "الصورة ذكرت الفولاذ والنحاس الأصفر كأمثلة للسبائك.", icon: "⚔️" },
            { question: "ما هي حالة المذاب في محلول 'سكر × ماء'؟", options: ["صلب", "سائل", "غاز", "جميع ما سبق"], answer: 0, feedback: "السكر هو المذاب وحالته الفيزيائية هي صلب.", icon: "🍬" },
            { question: "إذا كانت نسبة النحاس 70% في سبيكة النحاس الأصفر، فكم نسبة الخارصين؟", options: ["10%", "20%", "30%", "40%"], answer: 2, feedback: "النسبة المكملة لـ 100% هي 30% للخارصين.", icon: "🧮" },
            { question: "في المشروبات الغازية، ماذا تمثل عبارة 'غاز × سائل'؟", options: ["مذيب × مذاب", "مذاب × مذيب", "غازان مختلفان", "سائلان مختلفان"], answer: 1, feedback: "تعني أن الغاز (مذاب) تم إذابته في السائل (مذيب).", icon: "📝" },
            { question: "أي من هذه المحاليل يحتوي على مذاب غازي في مذيب سائل؟", options: ["ماء البحر والمشروبات الغازية", "الخل وماء البحر", "الفولاذ والنحاس الأصفر", "الهواء الجوي"], answer: 0, feedback: "كلاهما يحتوي على غاز مذاب في سائل.", icon: "💡" },
            { question: "تلخيصاً للخريطة الذهنية: نوع المحلول يتبع دائماً...", options: ["حالة المذاب", "حالة المذيب", "كمية المذاب", "لون المحلول"], answer: 1, feedback: "تحدد نوع المحلول على حسب حالة المذيب.", icon: "📌" }
        ];

        // المتغيرات لحفظ الحالة
        let studentName = "";
        let studentClass = "";
        let score = 0;
        
        let currentSequence = []; // مصفوفة للأسئلة المراد عرضها
        let currentSeqIndex = 0; // المؤشر الحالي
        let wrongAnswersIndices = []; // لحفظ أرقام الأسئلة الخاطئة
        let isReviewMode = false; // هل نحن في وضع المراجعة؟

        function startQuiz() {
            studentName = document.getElementById('studentName').value.trim();
            studentClass = document.getElementById('studentClass').value;
            
            if (!studentName || !studentClass) {
                alert("الرجاء إدخال اسمك واختيار الصف قبل البدء!");
                return;
            }

            // إعداد الأسئلة للوضع الطبيعي (من 0 إلى 39)
            currentSequence = Array.from({length: quizData.length}, (_, i) => i);
            currentSeqIndex = 0;
            score = 0;
            wrongAnswersIndices = [];
            isReviewMode = false;

            document.getElementById('login-screen').classList.remove('active');
            document.getElementById('quiz-screen').classList.add('active');
            loadQuestion();
        }

        function loadQuestion() {
            let actualQuestionIndex = currentSequence[currentSeqIndex];
            let q = quizData[actualQuestionIndex];

            // تحديث الخلفية
            document.getElementById('quiz-screen').style.background = gradients[actualQuestionIndex % gradients.length];
            
            // تحديث شريط التقدم
            let currentNumber = currentSeqIndex + 1;
            let totalNumber = currentSequence.length;
            document.getElementById('progress-text').innerText = isReviewMode ? `مراجعة: السؤال ${currentNumber} من ${totalNumber}` : `السؤال ${currentNumber} من ${totalNumber}`;
            let progressPercent = (currentNumber / totalNumber) * 100;
            document.getElementById('progress-bar-fill').style.width = progressPercent + '%';

            // تعبئة البيانات
            document.getElementById('q-icon').innerText = q.icon;
            document.getElementById('q-text').innerText = q.question;
            
            let optionsHtml = '';
            q.options.forEach((opt, index) => {
                optionsHtml += `<button class="option-btn" onclick="checkAnswer(${index}, this)">${opt}</button>`;
            });
            document.getElementById('q-options').innerHTML = optionsHtml;

            // إخفاء التغذية الراجعة والزر
            document.getElementById('q-feedback').style.display = 'none';
            document.getElementById('next-btn').style.display = 'none';
        }

        function checkAnswer(selectedIndex, btnElement) {
            let actualQuestionIndex = currentSequence[currentSeqIndex];
            let q = quizData[actualQuestionIndex];
            let buttons = document.querySelectorAll('.option-btn');
            
            // تعطيل الأزرار لمنع النقر المتعدد
            buttons.forEach(btn => btn.disabled = true);

            let isCorrect = (selectedIndex === q.answer);
            let feedbackElement = document.getElementById('q-feedback');

            if (isCorrect) {
                btnElement.classList.add('correct');
                feedbackElement.innerHTML = "✅ إجابة صحيحة!<br>" + q.feedback;
                feedbackElement.style.backgroundColor = "rgba(46, 204, 113, 0.95)";
                if (!isReviewMode) score++; // لا تزيد الدرجة إذا كان في وضع المراجعة
            } else {
                btnElement.classList.add('wrong');
                buttons[q.answer].classList.add('correct');
                feedbackElement.innerHTML = "❌ إجابة خاطئة.<br>" + q.feedback;
                feedbackElement.style.backgroundColor = "rgba(231, 76, 60, 0.95)";
                if (!isReviewMode) wrongAnswersIndices.push(actualQuestionIndex); // تسجيل الخطأ للمراجعة لاحقاً
            }

            feedbackElement.style.display = 'block';
            
            let nextBtn = document.getElementById('next-btn');
            if (currentSeqIndex === currentSequence.length - 1) {
                nextBtn.innerText = isReviewMode ? "إنهاء المراجعة 🏁" : "عرض النتيجة النهائية 🏁";
            } else {
                nextBtn.innerText = "السؤال التالي ➔";
            }
            nextBtn.style.display = 'block';
        }

        function handleNextAction() {
            currentSeqIndex++;
            if (currentSeqIndex < currentSequence.length) {
                loadQuestion();
            } else {
                showResult();
            }
        }

        function showResult() {
            document.getElementById('quiz-screen').classList.remove('active');
            document.getElementById('result-screen').classList.add('active');

            if (!isReviewMode) {
                // إظهار الدرجة
                document.getElementById('final-score').innerText = `نتيجتك: ${score} من ${quizData.length}`;
                
                // إظهار زر المراجعة إذا كان هناك أخطاء
                if (wrongAnswersIndices.length > 0) {
                    document.getElementById('review-btn').style.display = 'inline-block';
                }

                // إرسال البيانات لجوجل شيت (في الخلفية)
                sendDataToGoogle();
            } else {
                // أنهى وضع المراجعة
                document.getElementById('result-msg').innerText = "تم الانتهاء من مراجعة أخطائك!";
                document.getElementById('review-btn').style.display = 'none';
                document.getElementById('loading-msg').style.display = 'none';
            }
        }

        function sendDataToGoogle() {
            document.getElementById('loading-msg').innerText = "جاري إرسال النتيجة للأستاذ... ⏳";
            
            const formData = new FormData();
            formData.append('name', studentName);
            formData.append('studentClass', studentClass);
            formData.append('score', score);

            fetch(GOOGLE_SCRIPT_URL, {
                method: 'POST',
                body: formData
            })
            .then(response => {
                document.getElementById('loading-msg').innerText = "✅ تم تسجيل النتيجة عند الأستاذ بنجاح!";
                document.getElementById('loading-msg').style.color = "#2ecc71";
            })
            .catch(error => {
                document.getElementById('loading-msg').innerText = "⚠️ حدث خطأ أثناء إرسال النتيجة.";
                document.getElementById('loading-msg').style.color = "#e74c3c";
                console.error('Error!', error.message);
            });
        }

        function startReviewMode() {
            isReviewMode = true;
            currentSequence = [...wrongAnswersIndices]; // نضع فقط الأسئلة الخاطئة في الطابور
            currentSeqIndex = 0;
            
            document.getElementById('result-screen').classList.remove('active');
            document.getElementById('quiz-screen').classList.add('active');
            
            loadQuestion();
        }
    </script>
</body>
</html>
